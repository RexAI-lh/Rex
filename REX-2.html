<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>REX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --orange: #f97316;
    --orange-dark: #ea580c;
    --green: #22c55e;
    --red: #ef4444;
    --bg: #0a0a0a;
    --bg2: #0d0d0d;
    --bg3: #111;
    --border: #1f1f1f;
    --border2: #2a2a2a;
    --text: #cccccc;
    --dim: #666;
    --dimmer: #444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font-family: 'Share Tech Mono', monospace; color: var(--text); }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 999;
  }

  /* BOOT */
  #boot {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; gap: 28px; transition: opacity 0.8s;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-emblem {
    width: 120px; height: 120px;
    border: 3px solid var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 50px rgba(249,115,22,0.5), inset 0 0 30px rgba(249,115,22,0.05);
    animation: flicker 4s infinite;
  }
  .boot-title {
    font-family: 'Orbitron', monospace;
    font-size: 52px; font-weight: 900;
    color: var(--orange); letter-spacing: 14px;
    animation: glow 2s ease-in-out infinite;
  }
  .boot-sub { color: #444; font-size: 11px; letter-spacing: 4px; margin-top: 6px; }
  #boot-text { color: var(--orange); font-size: 13px; letter-spacing: 2px; min-height: 20px; }
  .cursor { animation: blink 1s infinite; }

  /* HEADER */
  #header {
    background: rgba(10,10,10,0.97); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .rex-emblem {
    width: 42px; height: 42px;
    border: 2px solid var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(249,115,22,0.3);
    transition: all 0.3s; flex-shrink: 0; position: relative;
  }
  .rex-emblem.speaking { border-color: var(--green); box-shadow: 0 0 20px rgba(34,197,94,0.5); }
  .rex-emblem.listening { border-color: var(--red); box-shadow: 0 0 20px rgba(239,68,68,0.5); }
  .rex-name { font-family: 'Orbitron', monospace; color: var(--orange); font-size: 17px; font-weight: 700; letter-spacing: 4px; }
  .rex-status { color: var(--dim); font-size: 9px; letter-spacing: 2px; margin-top: 2px; transition: all 0.3s; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #dossier-btn {
    background: transparent; border: 1px solid var(--border2);
    color: var(--dim); padding: 5px 10px; border-radius: 7px;
    font-size: 10px; letter-spacing: 1px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; transition: all 0.2s;
  }
  #dossier-btn.active { background: rgba(249,115,22,0.15); border-color: var(--orange); color: var(--orange); }
  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); flex-shrink: 0; }

  /* DOSSIER */
  #dossier-panel { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 16px; display: none; flex-shrink: 0; }
  #dossier-panel.show { display: block; }
  .dossier-title { color: var(--orange); font-size: 10px; letter-spacing: 3px; margin-bottom: 10px; }
  .mem-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 150px; overflow-y: auto; }
  .mem-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: var(--bg3); border-radius: 7px; border: 1px solid var(--border); font-size: 11px; color: #aaa; }
  .mem-del { background: transparent; border: none; color: var(--orange); cursor: pointer; font-size: 13px; padding: 0 4px; flex-shrink: 0; }
  .mem-input-row { display: flex; gap: 8px; }
  #mem-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; color: var(--text); font-size: 12px; font-family: 'Share Tech Mono', monospace; outline: none; }
  #mem-add { background: var(--orange); border: none; border-radius: 7px; padding: 8px 14px; color: #000; font-size: 11px; cursor: pointer; font-family: 'Orbitron', monospace; font-weight: 700; }

  /* MESSAGES */
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
  .msg-row { display: flex; gap: 10px; align-items: flex-start; animation: slideUp 0.3s ease forwards; }
  .msg-row.user { justify-content: flex-end; }
  .msg-avatar { width: 28px; height: 28px; border: 1.5px solid var(--orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .msg-bubble { max-width: 80%; padding: 12px 15px; border-radius: 16px; font-size: 13px; line-height: 1.7; }
  .msg-bubble.rex { background: var(--bg3); border: 1px solid #222; border-radius: 16px 16px 16px 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  .msg-bubble.user { background: linear-gradient(135deg, var(--orange), var(--orange-dark)); color: #fff; border-radius: 16px 16px 4px 16px; box-shadow: 0 4px 16px rgba(249,115,22,0.3); font-family: sans-serif; }
  .rex-label { color: var(--orange); font-size: 9px; letter-spacing: 2px; margin-bottom: 6px; }

  /* Typing */
  #typing { display: none; }
  #typing.show { display: flex; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .typing-inner { display: flex; align-items: center; gap: 5px; padding: 14px 16px; background: var(--bg3); border: 1px solid #222; border-radius: 16px 16px 16px 4px; }

  /* Suggestions */
  #suggestions { margin-top: 4px; }
  .sugg-label { color: var(--dimmer); font-size: 10px; letter-spacing: 2px; margin-bottom: 10px; }
  .sugg-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .sugg-btn { background: transparent; border: 1px solid var(--border2); color: var(--dim); padding: 7px 12px; border-radius: 18px; font-size: 11px; cursor: pointer; font-family: 'Share Tech Mono', monospace; transition: all 0.2s; text-align: left; }

  /* BIG VOICE INDICATOR - center of screen when listening */
  #voice-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50; gap: 24px;
  }
  #voice-overlay.show { display: flex; }
  .voice-circle {
    width: 140px; height: 140px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .voice-circle.listening { background: rgba(239,68,68,0.1); border: 3px solid var(--red); box-shadow: 0 0 40px rgba(239,68,68,0.4); }
  .voice-circle.speaking { background: rgba(34,197,94,0.1); border: 3px solid var(--green); box-shadow: 0 0 40px rgba(34,197,94,0.4); }
  .voice-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid currentColor; animation: ripple 1.5s ease-out infinite;
  }
  .voice-ring-2 { animation-delay: 0.5s; }
  .voice-label { font-family: 'Orbitron', monospace; font-size: 14px; letter-spacing: 3px; }
  .voice-label.listening { color: var(--red); }
  .voice-label.speaking { color: var(--green); }
  .voice-transcript { color: #888; font-size: 13px; max-width: 280px; text-align: center; line-height: 1.6; min-height: 20px; }
  .speak-wave { display: flex; align-items: center; gap: 4px; }
  .speak-bar { width: 4px; border-radius: 2px; animation: speakWave 0.5s ease-in-out infinite; }
  .speak-bar.g { background: var(--green); }
  .speak-bar.r { background: var(--red); }
  .speak-bar:nth-child(1) { height: 20px; }
  .speak-bar:nth-child(2) { height: 30px; animation-delay: 0.1s; }
  .speak-bar:nth-child(3) { height: 40px; animation-delay: 0.2s; }
  .speak-bar:nth-child(4) { height: 30px; animation-delay: 0.3s; }
  .speak-bar:nth-child(5) { height: 20px; animation-delay: 0.4s; }

  /* VOICE STATUS BAR */
  #voice-bar { background: var(--bg2); border-top: 1px solid var(--border); padding: 9px 16px; display: none; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0; }
  #voice-bar.show { display: flex; }
  #voice-status-text { font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); animation: pulse 1s infinite; }

  /* INPUT */
  #input-area { border-top: 1px solid var(--border); background: rgba(10,10,10,0.98); padding: 12px 14px 20px; flex-shrink: 0; }
  .input-row { display: flex; gap: 9px; align-items: flex-end; }
  #wake-btn {
    width: 56px; height: 56px; flex-shrink: 0;
    background: var(--bg3); border: 2px solid var(--border2);
    border-radius: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; transition: all 0.2s; gap: 3px;
  }
  #wake-btn.armed { background: var(--orange); border-color: var(--orange); }
  #wake-btn.armed .wake-ring { display: block; }
  #wake-btn.listening-cmd { background: var(--red); border-color: var(--red); }
  #wake-btn.speaking-now { background: var(--green); border-color: var(--green); }
  .wake-ring { display: none; position: absolute; inset: -3px; border-radius: 14px; border: 2px solid var(--orange); animation: ripple 1.8s ease-out infinite; }
  .wake-label { font-size: 7px; letter-spacing: 1px; color: #000; font-family: 'Orbitron', monospace; font-weight: 700; }
  #text-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: 11px; padding: 12px 15px; color: var(--text); font-size: 14px; font-family: 'Share Tech Mono', monospace; resize: none; line-height: 1.5; outline: none; min-height: 56px; max-height: 110px; transition: border-color 0.2s; -webkit-overflow-scrolling: touch; }
  #text-input:focus { border-color: var(--orange); }
  #send-btn { width: 56px; height: 56px; flex-shrink: 0; background: var(--bg3); border: none; border-radius: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  #send-btn.active { background: var(--orange); }
  .input-footer { text-align: center; margin-top: 8px; color: #1f1f1f; font-size: 9px; letter-spacing: 1px; }

  /* ANIMATIONS */
  @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }
  @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.75} 94%{opacity:1} }
  @keyframes glow { 0%,100%{text-shadow:0 0 10px #f97316,0 0 20px #f97316} 50%{text-shadow:0 0 20px #f97316,0 0 50px #f97316,0 0 70px #ea580c} }
  @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes ripple { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(2.2);opacity:0} }
  @keyframes speakWave { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div style="text-align:center">
    <div class="boot-emblem">
      <svg width="58" height="58" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="2.5" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="2" fill="rgba(249,115,22,0.1)"/>
        <line x1="30" y1="5" x2="30" y2="20" stroke="#f97316" stroke-width="1.5"/>
      </svg>
    </div>
    <div style="height:16px"></div>
    <div class="boot-title">REX</div>
    <div class="boot-sub">WELDING BUSINESS INTELLIGENCE UNIT</div>
  </div>
  <div id="boot-text"><span id="boot-typed"></span><span class="cursor">_</span></div>
</div>

<!-- VOICE OVERLAY (fullscreen when listening or speaking) -->
<div id="voice-overlay">
  <div class="voice-circle" id="voice-circle">
    <div class="voice-ring" id="voice-ring"></div>
    <div class="voice-ring voice-ring-2" id="voice-ring2"></div>
    <div class="speak-wave" id="speak-wave" style="display:none">
      <div class="speak-bar g"></div><div class="speak-bar g"></div>
      <div class="speak-bar g"></div><div class="speak-bar g"></div>
      <div class="speak-bar g"></div>
    </div>
    <svg id="mic-svg" width="40" height="40" viewBox="0 0 24 24" fill="none">
      <rect x="9" y="2" width="6" height="12" rx="3" fill="#ef4444"/>
      <path d="M5 10a7 7 0 0 0 14 0" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="12" y2="21" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="voice-label" id="voice-overlay-label">LISTENING...</div>
  <div class="voice-transcript" id="voice-transcript">Speak now</div>
  <button onclick="cancelVoice()" style="background:transparent;border:1px solid #333;color:#666;padding:10px 20px;border-radius:20px;font-family:'Share Tech Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:1px;">CANCEL</button>
</div>

<!-- HEADER -->
<div id="header">
  <div class="header-left">
    <div class="rex-emblem" id="rex-emblem">
      <svg id="emblem-svg" width="20" height="20" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="3" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="2" fill="rgba(249,115,22,0.1)"/>
      </svg>
      <div id="emblem-bars" class="speak-wave" style="display:none">
        <div class="speak-bar g" style="height:8px"></div>
        <div class="speak-bar g" style="height:12px"></div>
        <div class="speak-bar g" style="height:8px"></div>
      </div>
    </div>
    <div>
      <div class="rex-name">REX</div>
      <div class="rex-status" id="rex-status">BUSINESS PARTNER · ONLINE</div>
    </div>
  </div>
  <div class="header-right">
    <button id="dossier-btn" onclick="toggleDossier()">◈ DOSSIER <span id="mem-count"></span></button>
    <div class="online-dot"></div>
  </div>
</div>

<!-- DOSSIER -->
<div id="dossier-panel">
  <div class="dossier-title">◈ REX'S DOSSIER ON YOUR BUSINESS</div>
  <div class="mem-list" id="mem-list"><div style="color:var(--dimmer);font-size:11px">No intel yet. REX learns as you talk.</div></div>
  <div class="mem-input-row">
    <input id="mem-input" type="text" placeholder="Add intel (e.g. My rate is $85/hr)..." onkeydown="if(event.key==='Enter')addMemory()"/>
    <button id="mem-add" onclick="addMemory()">ADD</button>
  </div>
</div>

<!-- MESSAGES -->
<div id="messages">
  <div id="typing" class="msg-row">
    <div class="msg-avatar">
      <svg width="12" height="12" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="4" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="3" fill="none"/>
      </svg>
    </div>
    <div class="typing-inner">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
</div>

<!-- VOICE STATUS BAR -->
<div id="voice-bar">
  <div id="rec-dot-bar" class="rec-dot" style="display:none;background:var(--orange);box-shadow:0 0 10px var(--orange)"></div>
  <span id="voice-status-text">SAY "HEY REX" ANYTIME</span>
</div>

<!-- INPUT -->
<div id="input-area">
  <div class="input-row">
    <button id="wake-btn" onclick="toggleWakeMode()">
      <div class="wake-ring"></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="#666" id="mic-fill"/>
        <path d="M5 10a7 7 0 0 0 14 0" stroke="#666" stroke-width="2" stroke-linecap="round" id="mic-stroke"/>
        <line x1="12" y1="17" x2="12" y2="21" stroke="#666" stroke-width="2" stroke-linecap="round" id="mic-line"/>
      </svg>
      <div class="wake-label" id="wake-label" style="color:#555">HEY REX</div>
    </button>
    <textarea id="text-input" rows="1" placeholder="Or type your situation here..."
      oninput="autoResize(this);updateSendBtn()"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea>
    <button id="send-btn" onclick="sendText()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="input-footer">REX · YOUR WELDING BUSINESS INTELLIGENCE UNIT</div>
</div>

<script>
// ── MEMORY ───────────────────────────────────────────────────────────────────
const MEMORY_KEY = 'rex_memory_v1';
let memory = [];
try { memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || '[]'); } catch {}

// ── STATE ────────────────────────────────────────────────────────────────────
let messages = [];
let loading = false;
let wakeMode = false;
let isListening = false;
let isSpeaking = false;
let recognition = null;
let restartTimer = null;
const synth = window.speechSynthesis;
const WAKE_PHRASES = ['hey rex', 'hey racks', 'hey wrecks', 'a rex', 'hey rex,'];

// ── SYSTEM PROMPT ─────────────────────────────────────────────────────────────
function buildSystem() {
  const memBlock = memory.length
    ? '\n\nCOMMANDER\'S DOSSIER:\n' + memory.map((m,i)=>`${i+1}. ${m}`).join('\n')
    : '';
  return `You are REX, an elite AI business partner for a welding business owner. Named after Captain Rex from Star Wars — loyal, tactical, direct, battle-tested. Speak like a trusted second-in-command: confident, no-nonsense, with occasional dry wit. Never ramble. Give clear actionable business advice.

Expertise: welding job pricing and quoting, client negotiation, growing a welding business, cash flow and equipment decisions, spotting job red flags, work-life balance for trade owners.

Keep all responses SHORT and conversational — 2 to 4 sentences max unless the question truly needs more. You will always be read aloud, so use NO markdown, NO bullet points, NO asterisks, NO pound signs, NO special characters. Plain spoken sentences only. Sound like a real business partner talking, not a report.

MEMORY PROTOCOL: If the user shares important business facts like their rate, client names, equipment, or business details, end your reply with exactly this on a new line:
MEMORY_SAVE: [one short sentence summarizing the fact]
Only include MEMORY_SAVE when there is genuinely new info worth remembering. Most replies will NOT need it.${memBlock}`;
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
const bootSeq = 'REX ONLINE. Ready for orders, Commander.';
let bi = 0;
const bootInt = setInterval(() => {
  document.getElementById('boot-typed').textContent = bootSeq.slice(0, ++bi);
  if (bi >= bootSeq.length) {
    clearInterval(bootInt);
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
      setTimeout(() => {
        document.getElementById('boot').style.display = 'none';
        addMessage('assistant', "Commander. REX online. Tap the HEY REX button to go fully hands-free. I'll listen for your wake word, hear your question, and talk back automatically. Gloves stay on.");
        renderSuggestions();
      }, 800);
    }, 400);
  }
}, 38);

// ── MESSAGES ──────────────────────────────────────────────────────────────────
function addMessage(role, content) {
  messages.push({role, content});
  const container = document.getElementById('messages');
  const typing = document.getElementById('typing');
  const row = document.createElement('div');
  row.className = 'msg-row' + (role === 'user' ? ' user' : '');
  if (role === 'assistant') {
    row.innerHTML = `<div class="msg-avatar"><svg width="12" height="12" viewBox="0 0 60 60" fill="none"><polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="4" fill="none"/><circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="3" fill="none"/></svg></div><div class="msg-bubble rex"><div class="rex-label">◈ REX</div>${escHtml(content)}</div>`;
  } else {
    row.innerHTML = `<div class="msg-bubble user">${escHtml(content)}</div>`;
  }
  container.insertBefore(row, typing);
  container.scrollTop = container.scrollHeight;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function setTyping(on) {
  document.getElementById('typing').className = 'msg-row' + (on ? ' show' : '');
  if (on) document.getElementById('messages').scrollTop = 999999;
}

function renderSuggestions() {
  if (messages.length > 1) return;
  const suggs = ['How do I price a structural steel job?','Client wants to lowball me. What do I say?','Should I hire a helper or stay solo?','How do I land commercial contracts?'];
  const div = document.createElement('div');
  div.id = 'suggestions';
  div.innerHTML = `<div class="sugg-label">QUICK COMMANDS — TAP OR SAY HEY REX</div><div class="sugg-grid">${suggs.map(s=>`<button class="sugg-btn" onclick="useSugg('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}</div>`;
  document.getElementById('messages').insertBefore(div, document.getElementById('typing'));
}

function useSugg(s) {
  const el = document.getElementById('suggestions');
  if (el) el.remove();
  sendMessage(s);
}

// ── API CALL ──────────────────────────────────────────────────────────────────
async function sendMessage(text) {
  if (!text || loading) return;
  loading = true;
  const sugg = document.getElementById('suggestions');
  if (sugg) sugg.remove();
  addMessage('user', text);
  setTyping(true);
  document.getElementById('text-input').value = '';
  autoResize(document.getElementById('text-input'));
  updateSendBtn();
  setStatus('THINKING...', false, false);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildSystem(),
        messages: messages.map(m => ({role: m.role, content: m.content}))
      })
    });

    if (!res.ok) {
      throw new Error('API error ' + res.status);
    }

    const data = await res.json();
    let reply = data.content?.[0]?.text || 'Signal lost. Try again, Commander.';

    // Save memory
    const memMatch = reply.match(/MEMORY_SAVE:\s*(.+)/i);
    if (memMatch) {
      memory.push(memMatch[1].trim());
      try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
      reply = reply.replace(/MEMORY_SAVE:.*$/im, '').trim();
      updateMemCount();
    }

    setTyping(false);
    addMessage('assistant', reply);
    // Always speak the reply
    speakReply(reply);

  } catch(e) {
    setTyping(false);
    const err = 'Comms down. Check your connection and try again.';
    addMessage('assistant', err);
    speakReply(err);
    console.error(e);
  }
  loading = false;
}

function sendText() {
  const val = document.getElementById('text-input').value.trim();
  if (val) sendMessage(val);
}

// ── SPEAK ─────────────────────────────────────────────────────────────────────
function speakReply(text) {
  if (!synth) {
    // No TTS — just go back to wake listening
    if (wakeMode) setTimeout(startWakeListening, 300);
    return;
  }
  synth.cancel();
  const clean = text.replace(/MEMORY_SAVE:.*$/gim,'').replace(/[*#_`•\-]/g,'').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 0.92; utter.pitch = 0.78; utter.volume = 1;

  // Load voices and pick deep male
  const setVoice = () => {
    const voices = synth.getVoices();
    const pref = voices.find(v => /david|daniel|alex|google us english/i.test(v.name))
               || voices.find(v => v.lang === 'en-US' && v.name.toLowerCase().includes('male'))
               || voices.find(v => v.lang === 'en-US')
               || voices[0];
    if (pref) utter.voice = pref;
  };
  setVoice();
  if (synth.getVoices().length === 0) {
    synth.onvoiceschanged = setVoice;
  }

  utter.onstart = () => {
    isSpeaking = true;
    showSpeakingUI(true);
  };
  utter.onend = () => {
    isSpeaking = false;
    showSpeakingUI(false);
    // Auto go back to wake listening
    if (wakeMode) {
      setStatus('SAY "HEY REX" ANYTIME', false, false);
      restartTimer = setTimeout(startWakeListening, 500);
    }
  };
  utter.onerror = () => {
    isSpeaking = false;
    showSpeakingUI(false);
    if (wakeMode) restartTimer = setTimeout(startWakeListening, 500);
  };
  synth.speak(utter);
}

function showSpeakingUI(on) {
  const emblem = document.getElementById('rex-emblem');
  const emblemSvg = document.getElementById('emblem-svg');
  const emblemBars = document.getElementById('emblem-bars');
  const overlay = document.getElementById('voice-overlay');
  const wakeBtn = document.getElementById('wake-btn');

  if (on) {
    emblem.classList.remove('listening'); emblem.classList.add('speaking');
    emblemSvg.style.display = 'none'; emblemBars.style.display = 'flex';
    setStatus('REX IS SPEAKING', false, true);
    // Show overlay
    overlay.className = 'show';
    document.getElementById('voice-circle').className = 'voice-circle speaking';
    document.getElementById('voice-ring').style.color = 'var(--green)';
    document.getElementById('voice-ring2').style.color = 'var(--green)';
    document.getElementById('speak-wave').style.display = 'flex';
    document.getElementById('mic-svg').style.display = 'none';
    document.getElementById('voice-overlay-label').className = 'voice-label speaking';
    document.getElementById('voice-overlay-label').textContent = 'REX SPEAKING';
    document.getElementById('voice-transcript').textContent = 'Tap anywhere to skip';
    wakeBtn.classList.remove('armed','listening-cmd'); wakeBtn.classList.add('speaking-now');
    document.getElementById('mic-fill').setAttribute('fill','#000');
    document.getElementById('mic-stroke').setAttribute('stroke','#000');
    document.getElementById('mic-line').setAttribute('stroke','#000');
    document.getElementById('wake-label').style.color = '#000';
  } else {
    emblem.classList.remove('speaking','listening');
    emblemSvg.style.display = 'block'; emblemBars.style.display = 'none';
    overlay.className = '';
    wakeBtn.classList.remove('speaking-now','listening-cmd');
    if (wakeMode) {
      wakeBtn.classList.add('armed');
      document.getElementById('mic-fill').setAttribute('fill','#000');
      document.getElementById('mic-stroke').setAttribute('stroke','#000');
      document.getElementById('mic-line').setAttribute('stroke','#000');
      document.getElementById('wake-label').style.color = '#000';
    } else {
      resetMicBtn();
    }
    setStatus(wakeMode ? 'SAY "HEY REX" ANYTIME' : '', false, false);
  }
}

// Tap overlay to skip speech
document.getElementById('voice-overlay').addEventListener('click', () => {
  if (isSpeaking) {
    synth.cancel();
  }
});

// ── SPEECH RECOGNITION ────────────────────────────────────────────────────────
function stopRecognition() {
  if (recognition) { try { recognition.stop(); } catch {} recognition = null; }
  clearTimeout(restartTimer);
}

function startCommandListening() {
  stopRecognition();
  isListening = true;

  // Update UI
  const overlay = document.getElementById('voice-overlay');
  overlay.className = 'show';
  document.getElementById('voice-circle').className = 'voice-circle listening';
  document.getElementById('voice-ring').style.color = 'var(--red)';
  document.getElementById('voice-ring2').style.color = 'var(--red)';
  document.getElementById('speak-wave').style.display = 'none';
  document.getElementById('mic-svg').style.display = 'block';
  document.getElementById('voice-overlay-label').className = 'voice-label listening';
  document.getElementById('voice-overlay-label').textContent = 'LISTENING...';
  document.getElementById('voice-transcript').textContent = 'Speak now';
  document.getElementById('rex-emblem').classList.add('listening');

  setStatus('RECORDING — SPEAK NOW', true, false);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.continuous = false; rec.interimResults = true; rec.lang = 'en-US';
  recognition = rec;

  rec.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('voice-transcript').textContent = final || interim || 'Speak now';
    if (final) {
      isListening = false;
      stopRecognition();
      document.getElementById('voice-overlay').className = '';
      document.getElementById('rex-emblem').classList.remove('listening');
      setStatus('THINKING...', false, false);
      setTimeout(() => sendMessage(final.trim()), 100);
    }
  };

  rec.onerror = (e) => {
    isListening = false;
    stopRecognition();
    document.getElementById('voice-overlay').className = '';
    document.getElementById('rex-emblem').classList.remove('listening');
    setStatus(wakeMode ? 'SAY "HEY REX" ANYTIME' : '', false, false);
    if (wakeMode) restartTimer = setTimeout(startWakeListening, 600);
  };

  rec.onend = () => {
    if (isListening) {
      isListening = false;
      document.getElementById('voice-overlay').className = '';
      document.getElementById('rex-emblem').classList.remove('listening');
      if (wakeMode && !isSpeaking) restartTimer = setTimeout(startWakeListening, 400);
    }
  };

  try { rec.start(); } catch(e) { console.log(e); isListening = false; }
}

function startWakeListening() {
  if (!wakeMode || isSpeaking || isListening) return;
  stopRecognition();

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  recognition = rec;

  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.toLowerCase().trim();
      if (WAKE_PHRASES.some(w => t.includes(w)) && wakeMode && !isListening && !isSpeaking) {
        stopRecognition();
        // Beep
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.connect(g); g.connect(ctx.destination);
          osc.frequency.value = 920; g.gain.value = 0.2;
          osc.start(); osc.stop(ctx.currentTime + 0.08);
        } catch {}
        setTimeout(startCommandListening, 300);
        return;
      }
    }
  };
  rec.onerror = (e) => {
    if (wakeMode && !isListening && !isSpeaking) {
      restartTimer = setTimeout(startWakeListening, 400);
    }
  };
  rec.onend = () => {
    if (wakeMode && !isListening && !isSpeaking) {
      restartTimer = setTimeout(startWakeListening, 300);
    }
  };
  try { rec.start(); } catch {}
}

function cancelVoice() {
  if (isSpeaking) synth.cancel();
  if (isListening) { stopRecognition(); isListening = false; }
  document.getElementById('voice-overlay').className = '';
  document.getElementById('rex-emblem').classList.remove('listening','speaking');
  document.getElementById('emblem-svg').style.display = 'block';
  document.getElementById('emblem-bars').style.display = 'none';
  if (wakeMode) {
    setStatus('SAY "HEY REX" ANYTIME', false, false);
    restartTimer = setTimeout(startWakeListening, 500);
  } else {
    setStatus('', false, false);
  }
}

function toggleWakeMode() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice not supported. Please use Chrome browser.'); return; }

  wakeMode = !wakeMode;

  if (wakeMode) {
    document.getElementById('wake-btn').classList.add('armed');
    document.getElementById('mic-fill').setAttribute('fill','#000');
    document.getElementById('mic-stroke').setAttribute('stroke','#000');
    document.getElementById('mic-line').setAttribute('stroke','#000');
    document.getElementById('wake-label').style.color = '#000';
    showVoiceBar(true);
    setStatus('SAY "HEY REX" ANYTIME', false, false);
    document.getElementById('text-input').placeholder = 'Hands-free mode ON — say "Hey REX"...';
    setTimeout(startWakeListening, 200);
  } else {
    stopRecognition(); synth.cancel();
    isSpeaking = false; isListening = false;
    document.getElementById('voice-overlay').className = '';
    document.getElementById('rex-emblem').classList.remove('listening','speaking');
    document.getElementById('emblem-svg').style.display = 'block';
    document.getElementById('emblem-bars').style.display = 'none';
    resetMicBtn();
    showVoiceBar(false);
    setStatus('', false, false);
    document.getElementById('text-input').placeholder = 'Or type your situation here...';
  }
}

function resetMicBtn() {
  const btn = document.getElementById('wake-btn');
  btn.classList.remove('armed','listening-cmd','speaking-now');
  document.getElementById('mic-fill').setAttribute('fill','#666');
  document.getElementById('mic-stroke').setAttribute('stroke','#666');
  document.getElementById('mic-line').setAttribute('stroke','#666');
  document.getElementById('wake-label').style.color = '#555';
}

// ── STATUS ────────────────────────────────────────────────────────────────────
function setStatus(text, isRec, isSpeak) {
  document.getElementById('rex-status').textContent = text || 'BUSINESS PARTNER · ONLINE';
  document.getElementById('voice-status-text').textContent = text || 'SAY "HEY REX" ANYTIME';
  const dot = document.getElementById('rec-dot-bar');
  dot.style.display = isRec ? 'block' : 'none';
  dot.style.background = isSpeak ? 'var(--green)' : 'var(--orange)';
  dot.style.boxShadow = isSpeak ? '0 0 10px var(--green)' : '0 0 10px var(--orange)';
  if (text) showVoiceBar(true);
}

function showVoiceBar(on) {
  document.getElementById('voice-bar').className = on ? 'show' : '';
}

// ── MEMORY ────────────────────────────────────────────────────────────────────
function toggleDossier() {
  document.getElementById('dossier-panel').classList.toggle('show');
  document.getElementById('dossier-btn').classList.toggle('active');
  renderMemory();
}

function renderMemory() {
  const list = document.getElementById('mem-list');
  if (memory.length === 0) { list.innerHTML = '<div style="color:var(--dimmer);font-size:11px">No intel yet. REX learns as you talk.</div>'; return; }
  list.innerHTML = memory.map((m,i) => `<div class="mem-item"><span>· ${escHtml(m)}</span><button class="mem-del" onclick="removeMemory(${i})">✕</button></div>`).join('');
}

function updateMemCount() {
  document.getElementById('mem-count').textContent = memory.length > 0 ? `(${memory.length})` : '';
  renderMemory();
}

function addMemory() {
  const val = document.getElementById('mem-input').value.trim();
  if (!val) return;
  memory.push(val);
  try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
  document.getElementById('mem-input').value = '';
  updateMemCount();
}

function removeMemory(i) {
  memory.splice(i, 1);
  try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
  updateMemCount();
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 110) + 'px'; }
function updateSendBtn() { document.getElementById('send-btn').className = document.getElementById('text-input').value.trim() && !loading ? 'active' : ''; }

updateMemCount();
</script>

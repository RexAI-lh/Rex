<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>REX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --orange: #f97316;
    --orange-dark: #ea580c;
    --green: #22c55e;
    --bg: #0a0a0a;
    --bg2: #0d0d0d;
    --bg3: #111;
    --border: #1f1f1f;
    --border2: #2a2a2a;
    --text: #cccccc;
    --dim: #666;
    --dimmer: #444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font-family: 'Share Tech Mono', monospace; color: var(--text); }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none; z-index: 999;
  }

  /* BOOT */
  #boot {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; gap: 28px; transition: opacity 0.6s;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-emblem {
    width: 110px; height: 110px;
    border: 3px solid var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(249,115,22,0.5), inset 0 0 30px rgba(249,115,22,0.05);
    animation: flicker 4s infinite;
  }
  .boot-title {
    font-family: 'Orbitron', monospace;
    font-size: 52px; font-weight: 900;
    color: var(--orange); letter-spacing: 14px;
    animation: glow 2s ease-in-out infinite;
  }
  .boot-sub { color: #555; font-size: 11px; letter-spacing: 4px; margin-top: 4px; }
  #boot-text { color: var(--orange); font-size: 13px; letter-spacing: 2px; min-height: 20px; }
  .cursor { animation: blink 1s infinite; }

  /* HEADER */
  #header {
    background: rgba(10,10,10,0.97); border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; position: relative; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .rex-emblem {
    width: 40px; height: 40px;
    border: 2px solid var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(249,115,22,0.3);
    transition: all 0.3s; flex-shrink: 0;
  }
  .rex-emblem.speaking { border-color: var(--green); box-shadow: 0 0 14px rgba(34,197,94,0.4); }
  .rex-name { font-family: 'Orbitron', monospace; color: var(--orange); font-size: 16px; font-weight: 700; letter-spacing: 4px; }
  .rex-status { color: var(--dim); font-size: 9px; letter-spacing: 2px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #dossier-btn {
    background: transparent; border: 1px solid var(--border2);
    color: var(--dim); padding: 5px 10px; border-radius: 7px;
    font-size: 10px; letter-spacing: 1px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; transition: all 0.2s;
  }
  #dossier-btn.active { background: rgba(249,115,22,0.15); border-color: var(--orange); color: var(--orange); }
  .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); flex-shrink: 0; }

  /* DOSSIER PANEL */
  #dossier-panel {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: none; flex-shrink: 0;
  }
  #dossier-panel.show { display: block; }
  .dossier-title { color: var(--orange); font-size: 10px; letter-spacing: 3px; margin-bottom: 10px; }
  .mem-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .mem-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; background: var(--bg3); border-radius: 7px;
    border: 1px solid var(--border); font-size: 11px; color: #aaa;
  }
  .mem-del { background: transparent; border: none; color: var(--orange); cursor: pointer; font-size: 13px; padding: 0 4px; }
  #mem-empty { color: var(--dimmer); font-size: 11px; }
  .mem-input-row { display: flex; gap: 8px; }
  #mem-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 7px; padding: 8px 10px; color: var(--text);
    font-size: 12px; font-family: 'Share Tech Mono', monospace; outline: none;
  }
  #mem-add {
    background: var(--orange); border: none; border-radius: 7px;
    padding: 8px 14px; color: #000; font-size: 11px; cursor: pointer;
    font-family: 'Orbitron', monospace; font-weight: 700;
  }

  /* MESSAGES */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 14px;
    -webkit-overflow-scrolling: touch;
  }
  .msg-row { display: flex; gap: 10px; align-items: flex-start; animation: slideUp 0.3s ease forwards; }
  .msg-row.user { justify-content: flex-end; }
  .msg-avatar {
    width: 28px; height: 28px; border: 1.5px solid var(--orange); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg-bubble {
    max-width: 78%; padding: 12px 15px; border-radius: 16px;
    font-size: 13px; line-height: 1.7;
  }
  .msg-bubble.rex {
    background: var(--bg3); border: 1px solid #222;
    border-radius: 16px 16px 16px 4px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .msg-bubble.user {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: #fff; border-radius: 16px 16px 4px 16px;
    box-shadow: 0 4px 16px rgba(249,115,22,0.3);
    font-family: sans-serif;
  }
  .rex-label { color: var(--orange); font-size: 9px; letter-spacing: 2px; margin-bottom: 6px; }

  /* Typing indicator */
  #typing { display: none; }
  #typing.show { display: flex; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  .typing-inner { display: flex; align-items: center; gap: 5px; padding: 14px 16px; background: var(--bg3); border: 1px solid #222; border-radius: 16px 16px 16px 4px; }

  /* Suggestions */
  #suggestions { margin-top: 4px; }
  .sugg-label { color: var(--dimmer); font-size: 10px; letter-spacing: 2px; margin-bottom: 10px; }
  .sugg-grid { display: flex; flex-wrap: wrap; gap: 7px; }
  .sugg-btn {
    background: transparent; border: 1px solid var(--border2);
    color: var(--dim); padding: 7px 12px; border-radius: 18px;
    font-size: 11px; cursor: pointer; font-family: 'Share Tech Mono', monospace;
    transition: all 0.2s; text-align: left;
  }

  /* Voice status */
  #voice-bar {
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 9px 16px; display: none;
    align-items: center; justify-content: center; gap: 10px;
    flex-shrink: 0;
  }
  #voice-bar.show { display: flex; }
  .speak-bars { display: flex; align-items: center; gap: 3px; }
  .speak-bar { width: 3px; height: 14px; background: var(--green); border-radius: 2px; animation: speakWave 0.5s ease-in-out infinite; }
  .speak-bar:nth-child(2) { animation-delay: 0.1s; }
  .speak-bar:nth-child(3) { animation-delay: 0.2s; }
  .speak-bar:nth-child(4) { animation-delay: 0.3s; }
  .speak-bar:nth-child(5) { animation-delay: 0.4s; }
  #voice-status-text { font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1s infinite; }

  /* INPUT AREA */
  #input-area {
    border-top: 1px solid var(--border);
    background: rgba(10,10,10,0.98);
    padding: 12px 14px 20px;
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 9px; align-items: flex-end; }
  #mic-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    background: var(--bg3); border: 2px solid var(--border2);
    border-radius: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: all 0.2s; overflow: visible;
  }
  #mic-btn.armed { background: var(--orange); border-color: var(--orange); }
  #mic-btn.armed .mic-ring { display: block; }
  #mic-btn.recording { background: var(--green); border-color: var(--green); }
  .mic-ring {
    display: none; position: absolute; inset: -2px; border-radius: 11px;
    border: 2px solid var(--orange); animation: ripple 1.8s ease-out infinite;
  }
  #text-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 11px; padding: 12px 15px; color: var(--text);
    font-size: 14px; font-family: 'Share Tech Mono', monospace;
    resize: none; line-height: 1.5; outline: none;
    min-height: 46px; max-height: 110px;
    transition: border-color 0.2s;
    -webkit-overflow-scrolling: touch;
  }
  #text-input:focus { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(249,115,22,0.15); }
  #send-btn {
    width: 46px; height: 46px; flex-shrink: 0;
    background: var(--bg3); border: none; border-radius: 11px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  #send-btn.active { background: var(--orange); }
  .input-footer { text-align: center; margin-top: 8px; color: #222; font-size: 9px; letter-spacing: 1px; }

  /* ANIMATIONS */
  @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }
  @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.75} 94%{opacity:1} }
  @keyframes glow { 0%,100%{text-shadow:0 0 10px #f97316,0 0 20px #f97316} 50%{text-shadow:0 0 20px #f97316,0 0 50px #f97316,0 0 70px #ea580c} }
  @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes ripple { 0%{transform:scale(1);opacity:0.8} 100%{transform:scale(2.3);opacity:0} }
  @keyframes speakWave { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* Scrollbar */
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }
</style>
</head>
<body>

<!-- BOOT SCREEN -->
<div id="boot">
  <div style="text-align:center">
    <div class="boot-emblem">
      <svg width="55" height="55" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="2.5" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="2" fill="rgba(249,115,22,0.1)"/>
        <line x1="30" y1="5" x2="30" y2="20" stroke="#f97316" stroke-width="1.5"/>
      </svg>
    </div>
    <div style="height:20px"></div>
    <div class="boot-title">REX</div>
    <div class="boot-sub">BUSINESS INTELLIGENCE UNIT</div>
  </div>
  <div id="boot-text"><span id="boot-typed"></span><span class="cursor">_</span></div>
</div>

<!-- HEADER -->
<div id="header">
  <div class="header-left">
    <div class="rex-emblem" id="rex-emblem">
      <svg id="emblem-icon" width="20" height="20" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="3" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="2" fill="rgba(249,115,22,0.1)"/>
      </svg>
      <div id="speak-bars-header" class="speak-bars" style="display:none">
        <div class="speak-bar"></div><div class="speak-bar"></div><div class="speak-bar"></div>
      </div>
    </div>
    <div>
      <div class="rex-name">REX</div>
      <div class="rex-status" id="rex-status">BUSINESS PARTNER · ONLINE</div>
    </div>
  </div>
  <div class="header-right">
    <button id="dossier-btn" onclick="toggleDossier()">◈ DOSSIER <span id="mem-count"></span></button>
    <div class="online-dot"></div>
  </div>
</div>

<!-- DOSSIER PANEL -->
<div id="dossier-panel">
  <div class="dossier-title">◈ REX'S DOSSIER ON YOUR BUSINESS</div>
  <div class="mem-list" id="mem-list">
    <div id="mem-empty">No intel yet. REX learns as you talk.</div>
  </div>
  <div class="mem-input-row">
    <input id="mem-input" type="text" placeholder="Add intel (e.g. My rate is $85/hr)..." onkeydown="if(event.key==='Enter')addMemory()"/>
    <button id="mem-add" onclick="addMemory()">ADD</button>
  </div>
</div>

<!-- MESSAGES -->
<div id="messages">
  <!-- Typing indicator -->
  <div id="typing" class="msg-row">
    <div class="msg-avatar">
      <svg width="12" height="12" viewBox="0 0 60 60" fill="none">
        <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="4" fill="none"/>
        <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="3" fill="none"/>
      </svg>
    </div>
    <div class="typing-inner">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
</div>

<!-- VOICE STATUS BAR -->
<div id="voice-bar">
  <div id="speak-bars-bar" class="speak-bars" style="display:none">
    <div class="speak-bar"></div><div class="speak-bar"></div>
    <div class="speak-bar"></div><div class="speak-bar"></div><div class="speak-bar"></div>
  </div>
  <div id="rec-dot" class="rec-dot" style="display:none"></div>
  <span id="voice-status-text">SAY "HEY REX" ANYTIME</span>
</div>

<!-- INPUT AREA -->
<div id="input-area">
  <div class="input-row">
    <button id="mic-btn" onclick="toggleWakeMode()" title="Hey REX wake word">
      <div class="mic-ring"></div>
      <svg id="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="#666"/>
        <path d="M5 10a7 7 0 0 0 14 0" stroke="#666" stroke-width="2" stroke-linecap="round"/>
        <line x1="12" y1="17" x2="12" y2="21" stroke="#666" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <textarea id="text-input" rows="1" placeholder='Give REX your situation...'
      oninput="autoResize(this);updateSendBtn()"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"></textarea>
    <button id="send-btn" onclick="sendText()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="input-footer">REX · YOUR WELDING BUSINESS INTELLIGENCE UNIT</div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
const MEMORY_KEY = 'rex_memory_v1';
let memory = [];
try { memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || '[]'); } catch {}

let messages = [];
let loading = false;
let wakeMode = false;
let listening = false;
let speaking = false;
let recognition = null;
let restartTimer = null;
const synth = window.speechSynthesis;
const WAKE_PHRASES = ['hey rex', 'hey racks', 'hey wrecks', 'a rex'];

// ── SYSTEM PROMPT ────────────────────────────────────────────────────────────
function buildSystem() {
  const memBlock = memory.length
    ? '\n\nCOMMANDER\'S DOSSIER:\n' + memory.map((m,i)=>`${i+1}. ${m}`).join('\n')
    : '';
  return `You are REX, an elite AI business partner for a welding business owner. Named after Captain Rex from Star Wars — loyal, tactical, direct, battle-tested. Speak like a trusted second-in-command: confident, no-nonsense, occasional dry wit. Never ramble. Give clear actionable business advice.

Expertise: welding pricing & quoting, client negotiation, growing a welding business, cash flow & equipment decisions, spotting job red flags, work-life balance for trade owners.

You are NOT generic. Assess problems like a battlefield commander. Always end with a clear recommendation. Keep responses concise and punchy — no walls of text. Responses will be read aloud, so use NO markdown, bullets, asterisks, pound signs, or special characters. Plain spoken sentences only.

MEMORY PROTOCOL: If user shares important business facts, end your reply with exactly:
MEMORY_SAVE: [one short sentence]
Only when genuinely new info. Not every reply.${memBlock}`;
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
const bootSeq = 'REX ONLINE. Ready for orders, Commander.';
let bi = 0;
const bootInterval = setInterval(() => {
  document.getElementById('boot-typed').textContent = bootSeq.slice(0, ++bi);
  if (bi >= bootSeq.length) {
    clearInterval(bootInterval);
    setTimeout(() => {
      document.getElementById('boot').classList.add('hide');
      setTimeout(() => {
        document.getElementById('boot').style.display = 'none';
        addMessage('assistant', "Commander. REX here. Tap the orange mic button to arm Hey REX mode, then just say Hey REX to give me orders hands-free. Or type below. What are we dealing with?");
        renderSuggestions();
      }, 600);
    }, 500);
  }
}, 38);

// ── MESSAGES ─────────────────────────────────────────────────────────────────
function addMessage(role, content) {
  messages.push({role, content});
  const container = document.getElementById('messages');
  const typing = document.getElementById('typing');

  const row = document.createElement('div');
  row.className = 'msg-row' + (role === 'user' ? ' user' : '');

  if (role === 'assistant') {
    row.innerHTML = `
      <div class="msg-avatar">
        <svg width="12" height="12" viewBox="0 0 60 60" fill="none">
          <polygon points="30,5 55,50 5,50" stroke="#f97316" stroke-width="4" fill="none"/>
          <circle cx="30" cy="35" r="8" stroke="#f97316" stroke-width="3" fill="none"/>
        </svg>
      </div>
      <div class="msg-bubble rex"><div class="rex-label">◈ REX</div>${escHtml(content)}</div>`;
  } else {
    row.innerHTML = `<div class="msg-bubble user">${escHtml(content)}</div>`;
  }

  container.insertBefore(row, typing);
  container.scrollTop = container.scrollHeight;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function setTyping(on) {
  const t = document.getElementById('typing');
  t.className = 'msg-row' + (on ? ' show' : '');
  if (on) document.getElementById('messages').scrollTop = 999999;
}

function renderSuggestions() {
  if (messages.length > 1) return;
  const suggs = [
    'How do I price a structural steel job?',
    'Client wants to lowball me. What do I say?',
    'Should I hire a helper or stay solo?',
    'How do I land commercial contracts?'
  ];
  const div = document.createElement('div');
  div.id = 'suggestions';
  div.innerHTML = `<div class="sugg-label">QUICK COMMANDS</div><div class="sugg-grid">${suggs.map(s=>`<button class="sugg-btn" onclick="useSuggestion('${s.replace(/'/g,"\\'")}')">→ ${s}</button>`).join('')}</div>`;
  const container = document.getElementById('messages');
  container.insertBefore(div, document.getElementById('typing'));
  container.scrollTop = container.scrollHeight;
}

function useSuggestion(s) {
  const el = document.getElementById('suggestions');
  if (el) el.remove();
  sendMessage(s);
}

// ── API CALL ──────────────────────────────────────────────────────────────────
async function sendMessage(text) {
  if (!text || loading) return;
  loading = true;

  const sugg = document.getElementById('suggestions');
  if (sugg) sugg.remove();

  addMessage('user', text);
  setTyping(true);
  document.getElementById('text-input').value = '';
  autoResize(document.getElementById('text-input'));
  updateSendBtn();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildSystem(),
        messages: messages.map(m => ({role: m.role, content: m.content}))
      })
    });
    const data = await res.json();
    let reply = data.content?.[0]?.text || 'Signal lost. Try again, Commander.';

    // Extract memory
    const memMatch = reply.match(/MEMORY_SAVE:\s*(.+)/i);
    if (memMatch) {
      memory.push(memMatch[1].trim());
      try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
      reply = reply.replace(/MEMORY_SAVE:.*$/im, '').trim();
      updateMemCount();
    }

    setTyping(false);
    addMessage('assistant', reply);
    speak(reply);
  } catch(e) {
    setTyping(false);
    const err = 'Comms down. Check your connection and try again.';
    addMessage('assistant', err);
    if (wakeMode) speak(err);
  }
  loading = false;
}

function sendText() {
  const val = document.getElementById('text-input').value.trim();
  if (val) sendMessage(val);
}

// ── SPEECH SYNTHESIS ──────────────────────────────────────────────────────────
function speak(text) {
  if (!synth) return;
  synth.cancel();
  const clean = text.replace(/MEMORY_SAVE:.*$/gim,'').replace(/[*#_`•]/g,'').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate = 0.93; utter.pitch = 0.8; utter.volume = 1;
  const voices = synth.getVoices();
  const pref = voices.find(v => /david|daniel|alex|google us english/i.test(v.name))
             || voices.find(v => v.lang === 'en-US' && !v.name.toLowerCase().includes('female'))
             || voices[0];
  if (pref) utter.voice = pref;
  utter.onstart = () => { speaking = true; setSpeakingUI(true); };
  utter.onend = () => {
    speaking = false; setSpeakingUI(false);
    if (wakeMode) restartTimer = setTimeout(startWakeListening, 400);
  };
  utter.onerror = () => { speaking = false; setSpeakingUI(false); };
  synth.speak(utter);
}

function setSpeakingUI(on) {
  const emblem = document.getElementById('rex-emblem');
  const icon = document.getElementById('emblem-icon');
  const bars = document.getElementById('speak-bars-header');
  const barBars = document.getElementById('speak-bars-bar');
  const statusText = document.getElementById('voice-status-text');

  if (on) {
    emblem.classList.add('speaking');
    icon.style.display = 'none'; bars.style.display = 'flex';
    if (barBars) barBars.style.display = 'flex';
    document.getElementById('rec-dot').style.display = 'none';
    statusText.style.color = 'var(--green)';
    statusText.textContent = 'REX IS SPEAKING';
    document.getElementById('rex-status').textContent = 'SPEAKING...';
    showVoiceBar(true);
  } else {
    emblem.classList.remove('speaking');
    icon.style.display = 'block'; bars.style.display = 'none';
    if (barBars) barBars.style.display = 'none';
    statusText.style.color = 'var(--dim)';
    document.getElementById('rex-status').textContent = wakeMode ? 'LISTENING FOR WAKE WORD' : 'BUSINESS PARTNER · ONLINE';
    if (wakeMode) {
      statusText.textContent = 'SAY "HEY REX" ANYTIME';
      showVoiceBar(true);
    } else {
      showVoiceBar(false);
    }
  }
}

function showVoiceBar(on) {
  document.getElementById('voice-bar').className = on ? 'show' : '';
}

// ── SPEECH RECOGNITION ────────────────────────────────────────────────────────
function stopRecognition() {
  if (recognition) { try { recognition.stop(); } catch {} recognition = null; }
  clearTimeout(restartTimer);
}

function startCommandListening() {
  stopRecognition();
  listening = true;
  document.getElementById('mic-btn').classList.remove('armed');
  document.getElementById('mic-btn').classList.add('recording');
  document.getElementById('mic-icon').innerHTML = `<rect x="9" y="2" width="6" height="12" rx="3" fill="#000"/><path d="M5 10a7 7 0 0 0 14 0" stroke="#000" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#000" stroke-width="2" stroke-linecap="round"/>`;
  document.getElementById('rec-dot').style.display = 'block';
  document.getElementById('speak-bars-bar').style.display = 'none';
  document.getElementById('voice-status-text').textContent = 'RECORDING — SPEAK NOW';
  document.getElementById('voice-status-text').style.color = 'var(--green)';
  document.getElementById('rex-status').textContent = 'RECORDING...';
  showVoiceBar(true);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.continuous = false; rec.interimResults = false; rec.lang = 'en-US';
  recognition = rec;

  rec.onresult = (e) => {
    const t = e.results[0][0].transcript.trim();
    listening = false;
    document.getElementById('text-input').value = t;
    document.getElementById('voice-status-text').textContent = `You said: "${t}"`;
    document.getElementById('voice-status-text').style.color = 'var(--dim)';
    document.getElementById('rec-dot').style.display = 'none';
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').classList.add('armed');
    document.getElementById('mic-icon').innerHTML = `<rect x="9" y="2" width="6" height="12" rx="3" fill="#000"/><path d="M5 10a7 7 0 0 0 14 0" stroke="#000" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#000" stroke-width="2" stroke-linecap="round"/>`;
    setTimeout(() => sendMessage(t), 100);
  };
  rec.onerror = () => {
    listening = false;
    document.getElementById('rec-dot').style.display = 'none';
    document.getElementById('voice-status-text').textContent = "Didn't catch that. Try again.";
    document.getElementById('mic-btn').classList.remove('recording');
    if (wakeMode) { document.getElementById('mic-btn').classList.add('armed'); setTimeout(startWakeListening, 800); }
  };
  rec.onend = () => {
    if (listening) {
      listening = false;
      document.getElementById('rec-dot').style.display = 'none';
      document.getElementById('mic-btn').classList.remove('recording');
      if (wakeMode) { document.getElementById('mic-btn').classList.add('armed'); setTimeout(startWakeListening, 400); }
    }
  };
  try { rec.start(); } catch(e) { console.log(e); }
}

function startWakeListening() {
  if (!wakeMode || speaking) return;
  stopRecognition();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  recognition = rec;

  rec.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.toLowerCase().trim();
      if (WAKE_PHRASES.some(w => t.includes(w)) && wakeMode && !listening && !speaking) {
        stopRecognition();
        document.getElementById('voice-status-text').textContent = 'WAKE WORD DETECTED!';
        // Beep
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator(); const g = ctx.createGain();
          osc.connect(g); g.connect(ctx.destination);
          osc.frequency.value = 880; g.gain.value = 0.2;
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        } catch {}
        setTimeout(startCommandListening, 350);
        return;
      }
    }
  };
  rec.onerror = (e) => {
    if (e.error === 'no-speech' && wakeMode) restartTimer = setTimeout(startWakeListening, 300);
  };
  rec.onend = () => {
    if (wakeMode && !listening && !speaking) restartTimer = setTimeout(startWakeListening, 300);
  };
  try { rec.start(); } catch {}
}

function toggleWakeMode() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Voice not supported in this browser. Use Chrome.'); return; }

  wakeMode = !wakeMode;
  const btn = document.getElementById('mic-btn');
  const icon = document.getElementById('mic-icon');

  if (wakeMode) {
    btn.classList.add('armed');
    icon.innerHTML = `<rect x="9" y="2" width="6" height="12" rx="3" fill="#000"/><path d="M5 10a7 7 0 0 0 14 0" stroke="#000" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#000" stroke-width="2" stroke-linecap="round"/>`;
    document.getElementById('voice-status-text').textContent = 'SAY "HEY REX" ANYTIME';
    document.getElementById('voice-status-text').style.color = 'var(--dim)';
    document.getElementById('rex-status').textContent = 'LISTENING FOR WAKE WORD';
    showVoiceBar(true);
    setTimeout(startWakeListening, 100);
  } else {
    btn.classList.remove('armed'); btn.classList.remove('recording');
    icon.innerHTML = `<rect x="9" y="2" width="6" height="12" rx="3" fill="#666"/><path d="M5 10a7 7 0 0 0 14 0" stroke="#666" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="21" stroke="#666" stroke-width="2" stroke-linecap="round"/>`;
    stopRecognition(); synth.cancel(); speaking = false;
    listening = false;
    document.getElementById('rec-dot').style.display = 'none';
    document.getElementById('speak-bars-bar').style.display = 'none';
    document.getElementById('rex-status').textContent = 'BUSINESS PARTNER · ONLINE';
    showVoiceBar(false);
  }
}

// ── MEMORY ────────────────────────────────────────────────────────────────────
function toggleDossier() {
  const panel = document.getElementById('dossier-panel');
  const btn = document.getElementById('dossier-btn');
  panel.classList.toggle('show');
  btn.classList.toggle('active');
  renderMemory();
}

function renderMemory() {
  const list = document.getElementById('mem-list');
  const empty = document.getElementById('mem-empty');
  if (memory.length === 0) {
    list.innerHTML = '<div id="mem-empty">No intel yet. REX learns as you talk.</div>';
    return;
  }
  list.innerHTML = memory.map((m, i) => `
    <div class="mem-item">
      <span>· ${escHtml(m)}</span>
      <button class="mem-del" onclick="removeMemory(${i})">✕</button>
    </div>`).join('');
}

function updateMemCount() {
  const el = document.getElementById('mem-count');
  el.textContent = memory.length > 0 ? `(${memory.length})` : '';
  renderMemory();
}

function addMemory() {
  const val = document.getElementById('mem-input').value.trim();
  if (!val) return;
  memory.push(val);
  try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
  document.getElementById('mem-input').value = '';
  updateMemCount();
  renderMemory();
}

function removeMemory(i) {
  memory.splice(i, 1);
  try { localStorage.setItem(MEMORY_KEY, JSON.stringify(memory)); } catch {}
  updateMemCount();
  renderMemory();
}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

function updateSendBtn() {
  const btn = document.getElementById('send-btn');
  const val = document.getElementById('text-input').value.trim();
  btn.className = val && !loading ? 'active' : '';
}

// Init memory count
updateMemCount();
</script>
